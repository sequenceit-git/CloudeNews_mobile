name: cloud_news_app
description: "CloudNews - multi-party video meetings powered by Tencent TRTC."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.3"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  tencent_rtc_sdk: 13.5.3
  permission_handler: ^11.4.0
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.0
  url_launcher: ^6.3.1
  file_picker: ^8.3.7
  path_provider: ^2.1.6
  open_filex: ^5.0.0

  http: ^1.2.2
  app_links: ^6.3.3
  provider: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: true
